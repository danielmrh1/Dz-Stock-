name: stock_dz_professional
description: Cross-platform Inventory & POS system built with Flutter (Android, iOS, Windows, macOS)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  sqflite_common_ffi: ^2.3.3+4
  path: ^1.9.0
  path_provider: ^2.1.3
  mobile_scanner: ^7.1.4
  pdf: ^3.11.0
  printing: ^5.13.4
  excel: ^4.0.6
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  collection: ^1.18.0
  image_picker: ^1.1.2
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/templates/
    - assets/images/